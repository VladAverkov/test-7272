<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1d1236">
<title>SPEEDLINE</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,500;0,700;0,900;1,900&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1d1236; --cream:#fff6e4; --pink:#ff3d7f; --yel:#ffd23f; --cyan:#35d6ff; --grn:#3ddc84; --red:#ff4d4d;
    --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
    --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
    --num:'Rubik',system-ui,sans-serif;
  }
  body.style-pixel{--num:'Press Start 2P',monospace}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--ink);
    font-family:'Rubik',system-ui,sans-serif;color:var(--cream);
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;
    -webkit-text-size-adjust:100%;overscroll-behavior:none}
  canvas.webgl{position:fixed;inset:0;z-index:0;display:block;touch-action:none}
  .hidden{display:none !important}
  button{font-family:inherit;touch-action:manipulation}

  /* --- «наклейка» в стиле комикса --- */
  .sticker{background:var(--cream);color:var(--ink);border:3px solid var(--ink);border-radius:10px;
    box-shadow:4px 4px 0 var(--ink)}
  .cbtn{display:inline-flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;
    font-weight:900;font-style:italic;letter-spacing:1px;color:var(--ink);background:var(--yel);
    border:3px solid var(--ink);border-radius:14px;box-shadow:5px 5px 0 var(--ink);
    padding:12px 26px;font-size:20px;transform:rotate(-1.5deg);transition:transform .08s,box-shadow .08s}
  .cbtn:active{transform:rotate(-1.5deg) translate(3px,3px);box-shadow:2px 2px 0 var(--ink)}
  .cbtn.alt{background:var(--cream)} .cbtn.pink{background:var(--pink);color:#fff}
  .icon{width:52px;height:52px;padding:0;font-size:22px;border-radius:14px;transform:none;font-style:normal}
  .icon:active{transform:translate(3px,3px)}

  /* ---------- HUD ---------- */
  #hud{position:fixed;inset:0;z-index:5;pointer-events:none}
  #mapPanel{position:absolute;top:calc(12px + var(--st));left:calc(12px + var(--sl));padding:5px;
    background:var(--ink);border:3px solid var(--cream);border-radius:12px;transform:rotate(-2deg)}
  #map{display:block;width:118px;height:118px}
  #timeBox{position:absolute;top:calc(10px + var(--st));left:50%;transform:translateX(-50%);text-align:center}
  #time{font-family:var(--num);font-weight:900;font-style:italic;font-size:42px;line-height:1;color:var(--cream);
    -webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:3px 3px 0 var(--ink)}
  body.style-pixel #time{font-size:28px;font-style:normal;-webkit-text-stroke:0;text-shadow:3px 3px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink)}
  #bestLine{display:inline-block;margin-top:6px;font-size:13px;font-weight:700;padding:2px 10px;transform:rotate(1.5deg)}
  #bestLine b{font-family:var(--num);font-weight:900}
  body.style-pixel #bestLine b{font-size:10px}
  #topBtns{position:absolute;top:calc(12px + var(--st));right:calc(12px + var(--sr));display:flex;gap:10px;pointer-events:auto}
  #cpChip{position:absolute;top:calc(76px + var(--st));right:calc(12px + var(--sr));font-weight:900;font-size:15px;
    padding:4px 12px;transform:rotate(2deg)}
  #cpChip.pop{animation:cpPop .36s steps(4)}
  @keyframes cpPop{0%{transform:rotate(2deg) scale(1.5);background:var(--grn)}100%{transform:rotate(2deg) scale(1)}}
  #speedBox{position:absolute;left:50%;bottom:calc(12px + var(--sb));transform:translateX(-50%);text-align:center}
  #speed{font-family:var(--num);font-weight:900;font-style:italic;font-size:46px;line-height:1;color:var(--yel);
    -webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:3px 3px 0 var(--ink)}
  body.style-pixel #speed{font-size:26px;font-style:normal;-webkit-text-stroke:0;text-shadow:3px 3px 0 var(--ink),-2px -2px 0 var(--ink)}
  #kmh{font-size:11px;font-weight:900;letter-spacing:2px;color:var(--cream);text-shadow:2px 2px 0 var(--ink)}
  #barWrap{width:170px;height:10px;background:var(--ink);border:2px solid var(--ink);border-radius:6px;margin:5px auto 0;overflow:hidden}
  #bar{height:100%;width:0%;background:repeating-linear-gradient(90deg,var(--yel) 0 8px,var(--pink) 8px 16px)}
  #steerInd{position:absolute;left:50%;bottom:calc(92px + var(--sb));transform:translateX(-50%);
    width:140px;height:8px;background:rgba(29,18,54,.55);border-radius:4px}
  #steerInd::after{content:'';position:absolute;left:50%;top:-3px;width:2px;height:14px;background:rgba(255,246,228,.6)}
  #steerDot{position:absolute;top:-5px;left:50%;width:18px;height:18px;margin-left:-9px;border-radius:50%;
    background:var(--yel);border:3px solid var(--ink)}

  /* полосы скорости и виньетка */
  #speedlines{position:fixed;inset:-10%;z-index:3;pointer-events:none;opacity:0;
    background:repeating-conic-gradient(from 0deg at 50% 46%,rgba(255,255,255,0) 0deg 2.6deg,rgba(255,246,228,.7) 2.6deg 2.9deg);
    -webkit-mask-image:radial-gradient(ellipse at 50% 46%,transparent 36%,#000 80%);
    mask-image:radial-gradient(ellipse at 50% 46%,transparent 36%,#000 80%);will-change:transform,opacity}

  /* комикс-надписи */
  #fxLayer{position:fixed;inset:0;z-index:6;pointer-events:none;overflow:hidden}
  .fx{position:absolute;font-weight:900;font-style:italic;font-size:58px;line-height:1;white-space:nowrap;
    -webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:5px 5px 0 var(--ink);
    transform:translate(-50%,-50%);animation:fxPop .9s steps(9) forwards}
  body.style-pixel .fx{font-family:'Press Start 2P';font-style:normal;font-size:30px;-webkit-text-stroke:0;
    text-shadow:4px 4px 0 var(--ink),-3px -3px 0 var(--ink),3px -3px 0 var(--ink),-3px 3px 0 var(--ink)}
  @keyframes fxPop{0%{transform:translate(-50%,-50%) scale(.3) rotate(-14deg);opacity:1}
    18%{transform:translate(-50%,-50%) scale(1.25) rotate(-6deg)}30%{transform:translate(-50%,-50%) scale(1) rotate(-8deg)}
    80%{opacity:1}100%{transform:translate(-50%,-60%) scale(1.05) rotate(-8deg);opacity:0}}
  .fx.burst::before{content:'';position:absolute;left:50%;top:50%;width:190%;height:300%;transform:translate(-50%,-50%);z-index:-1;
    background:var(--yel);border:3px solid var(--ink);
    clip-path:polygon(50% 0,58% 30%,85% 8%,70% 38%,100% 40%,72% 55%,95% 85%,62% 68%,55% 100%,45% 70%,15% 95%,30% 62%,0 55%,28% 42%,8% 15%,40% 30%)}

  /* светофор */
  #lights{position:fixed;top:16%;left:50%;transform:translateX(-50%) rotate(-1deg);z-index:7;
    display:flex;gap:12px;background:var(--ink);padding:12px 18px;border:3px solid var(--cream);border-radius:16px;
    box-shadow:5px 5px 0 rgba(0,0,0,.35)}
  .bulb{width:34px;height:34px;border-radius:50%;background:#3a2240;border:3px solid #000}
  .bulb.on{background:#ff3b2f;box-shadow:0 0 0 4px rgba(255,80,60,.35),0 0 22px rgba(255,60,30,.9)}
  #countdown{position:fixed;top:38%;left:50%;z-index:7}
  #wrongway{position:fixed;top:30%;left:50%;transform:translateX(-50%) rotate(-3deg);z-index:6;
    font-weight:900;font-style:italic;font-size:30px;color:#fff;background:var(--red);padding:4px 16px;
    border:3px solid var(--ink);border-radius:10px;box-shadow:4px 4px 0 var(--ink);animation:blink .5s steps(2) infinite}
  @keyframes blink{50%{opacity:.25}}
  #hint{position:fixed;left:50%;top:calc(30% + 70px);transform:translateX(-50%);z-index:7;display:flex;gap:10px;flex-wrap:wrap;
    justify-content:center;max-width:92vw}
  #hint .sticker{padding:7px 12px;font-weight:700;font-size:15px}
  #hint b{color:var(--pink)}

  #toast{position:fixed;left:50%;top:24%;transform:translateX(-50%) rotate(-1deg);z-index:30;padding:10px 16px;
    font-size:14px;font-weight:700;max-width:86vw;text-align:center;pointer-events:none}

  /* ---------- тач-кнопки ---------- */
  #touchUI{position:absolute;inset:0;pointer-events:none}
  .tbtn{position:absolute;pointer-events:auto;touch-action:none;display:flex;align-items:center;justify-content:center;
    flex-direction:column;font-weight:900;font-style:italic;font-size:17px;color:var(--cream);
    background:rgba(29,18,54,.45);border:3px solid rgba(255,246,228,.75);border-radius:22px;
    text-shadow:2px 2px 0 var(--ink)}
  .tbtn.on{transform:translate(2px,2px);background:var(--pink);border-color:var(--cream)}
  #tGas{right:calc(14px + var(--sr));bottom:calc(14px + var(--sb));width:112px;height:150px;font-size:20px}
  #tGas.on{background:var(--grn)}
  #tBrake{left:calc(14px + var(--sl));bottom:calc(14px + var(--sb));width:112px;height:104px}
  #tBrake.on{background:var(--red)}
  #tDrift{left:calc(14px + var(--sl));bottom:calc(130px + var(--sb));width:112px;height:58px;font-size:14px}
  #tDrift.on{background:var(--cyan);color:var(--ink);text-shadow:none}
  #tLeft,#tRight{bottom:calc(14px + var(--sb));width:86px;height:110px;font-size:30px;font-style:normal}
  #tLeft{left:calc(14px + var(--sl))} #tRight{left:calc(110px + var(--sl))}
  body.steer-tilt #tLeft,body.steer-tilt #tRight{display:none}
  body.steer-btn #tBrake{left:auto;right:calc(138px + var(--sr));width:92px;height:84px}
  body.steer-btn #tDrift{left:auto;right:calc(14px + var(--sr));bottom:calc(176px + var(--sb))}
  body.steer-btn #steerInd{display:none}
  body:not(.touch) #touchUI{display:none}

  /* ---------- экраны ---------- */
  .screen{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;
    padding:calc(12px + var(--st)) calc(12px + var(--sr)) calc(12px + var(--sb)) calc(12px + var(--sl));
    background:radial-gradient(circle at 1px 1px,rgba(29,18,54,.55) 1.2px,transparent 1.6px) 0 0/7px 7px,
      linear-gradient(160deg,rgba(29,18,54,.55),rgba(29,18,54,.25))}
  .panel{position:relative;max-width:560px;width:100%;max-height:100%;overflow:auto;text-align:center;
    display:flex;flex-direction:column;align-items:center;gap:14px;touch-action:pan-y}
  .logo{font-weight:900;font-style:italic;font-size:76px;line-height:.9;letter-spacing:-1px;color:var(--cream);
    -webkit-text-stroke:4px var(--ink);paint-order:stroke fill;text-shadow:6px 6px 0 var(--ink);transform:rotate(-4deg)}
  .logo span{color:var(--pink)}
  body.style-pixel .logo{font-family:'Press Start 2P';font-style:normal;font-size:44px;-webkit-text-stroke:0;
    text-shadow:5px 5px 0 var(--ink),-3px -3px 0 var(--ink),3px -3px 0 var(--ink),-3px 3px 0 var(--ink);line-height:1.2}
  #playBtn{font-size:28px;padding:14px 46px}
  .row{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
  .best{padding:6px 14px;font-weight:700;font-size:15px;transform:rotate(1.5deg)}
  .best b{font-family:var(--num);font-weight:900}
  body.style-pixel .best b{font-size:11px}
  .keys{font-size:13px;font-weight:700;color:var(--cream);text-shadow:2px 2px 0 var(--ink);opacity:.9}
  body.touch .keys{display:none}

  .card{padding:18px 20px;width:100%;transform:rotate(-.6deg)}
  .card h2{font-weight:900;font-style:italic;font-size:28px;margin-bottom:10px}
  .setRow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0;font-weight:700;font-size:15px;text-align:left}
  .seg{display:flex;gap:6px;flex-shrink:0}
  .seg button{font-weight:900;font-size:14px;color:var(--ink);background:#efe3cc;border:3px solid var(--ink);
    padding:7px 11px;border-radius:10px;cursor:pointer}
  .seg button.on{background:var(--yel);box-shadow:3px 3px 0 var(--ink)}
  #tiltTest{margin:6px 0 4px;display:flex;align-items:center;gap:12px;justify-content:center;flex-wrap:wrap}
  #menuSteer{position:relative;width:150px;height:10px;background:#d9c9ad;border:2px solid var(--ink);border-radius:6px}
  #menuSteer::after{content:'';position:absolute;left:50%;top:-4px;width:2px;height:14px;background:var(--ink)}
  #menuDot{position:absolute;top:-6px;left:50%;width:18px;height:18px;margin-left:-9px;border-radius:50%;
    background:var(--pink);border:3px solid var(--ink)}
  #sensorMsg{font-size:13px;font-weight:700;line-height:1.35;min-height:1.3em}
  #sensorMsg.ok{color:#14894a} #sensorMsg.bad{color:#c4213f}
  .tiltOnly{} body:not(.touch) .touchOnly{display:none} body.steer-btn .tiltOnly{display:none}

  .resTitle{font-weight:900;font-style:italic;font-size:54px;color:var(--yel);-webkit-text-stroke:3px var(--ink);
    paint-order:stroke fill;text-shadow:5px 5px 0 var(--ink);transform:rotate(-3deg)}
  .resTitle.rec{color:var(--pink);animation:wob .5s steps(2) infinite}
  @keyframes wob{50%{transform:rotate(2deg) scale(1.05)}}
  body.style-pixel .resTitle{font-family:'Press Start 2P';font-style:normal;font-size:30px;-webkit-text-stroke:0;
    text-shadow:4px 4px 0 var(--ink),-3px -3px 0 var(--ink),3px -3px 0 var(--ink),-3px 3px 0 var(--ink)}
  #resTime{font-family:var(--num);font-weight:900;font-size:46px;font-style:italic}
  body.style-pixel #resTime{font-size:24px;font-style:normal}
  .resRows{width:100%;font-size:15px;font-weight:700}
  .resRows div{display:flex;justify-content:space-between;padding:5px 2px;border-bottom:2px dashed rgba(29,18,54,.25)}
  .resRows div:last-child{border-bottom:none}
  .resRows b{font-family:var(--num);font-weight:900} body.style-pixel .resRows b{font-size:11px}
  .good{color:#14894a !important} .bad{color:#c4213f !important}
  #pauseScr .cbtn{min-width:230px}

  /* ---------- компактно на телефоне ---------- */
  body.touch #time{font-size:30px} body.touch.style-pixel #time{font-size:20px}
  body.touch #map{width:80px;height:80px}
  body.touch #bestLine{font-size:11px;margin-top:4px}
  body.touch #cpChip{top:calc(72px + var(--st));font-size:13px}
  body.touch #speed{font-size:32px} body.touch.style-pixel #speed{font-size:20px}
  body.touch #barWrap{width:120px}
  body.touch .bulb{width:24px;height:24px}
  body.touch .fx{font-size:40px} body.touch.style-pixel .fx{font-size:20px}
  @media (max-height:440px){
    .logo{font-size:52px} body.style-pixel .logo{font-size:30px}
    #playBtn{font-size:22px;padding:10px 36px}
    .panel{gap:10px} .card{padding:12px 16px} .card h2{font-size:22px;margin-bottom:4px}
    .setRow{margin:6px 0;font-size:13px} .seg button{padding:5px 9px;font-size:13px}
    .resTitle{font-size:38px} #resTime{font-size:32px} .resRows{font-size:13px} .resRows div{padding:3px 2px}
    #pauseScr .panel{gap:8px} #pauseScr .cbtn{padding:8px 20px;font-size:17px}
  }
</style>
</head>
<body class="style-comic">

<div id="speedlines"></div>
<div id="fxLayer"></div>

<div id="hud" class="hidden">
  <div id="mapPanel"><canvas id="map" width="150" height="150"></canvas></div>
  <div id="timeBox">
    <div id="time">0:00.000</div>
    <div id="bestLine" class="sticker">РЕКОРД <b id="bestHud">—</b></div>
  </div>
  <div id="topBtns">
    <button class="cbtn alt icon" id="bRestart" aria-label="Заново">⟲</button>
    <button class="cbtn alt icon" id="bPause" aria-label="Пауза">II</button>
  </div>
  <div id="cpChip" class="sticker">0/10</div>
  <div id="speedBox">
    <div id="speed">0</div><div id="kmh">КМ/Ч</div>
    <div id="barWrap"><div id="bar"></div></div>
  </div>
  <div id="wrongway" class="hidden">РАЗВОРОТ!</div>
  <div id="touchUI">
    <div id="steerInd"><div id="steerDot"></div></div>
    <div class="tbtn" id="tLeft">◀</div>
    <div class="tbtn" id="tRight">▶</div>
    <div class="tbtn" id="tDrift">ДРИФТ</div>
    <div class="tbtn" id="tBrake">ТОРМОЗ</div>
    <div class="tbtn" id="tGas">ГАЗ</div>
  </div>
</div>

<div id="lights" class="hidden">
  <div class="bulb"></div><div class="bulb"></div><div class="bulb"></div><div class="bulb"></div><div class="bulb"></div>
</div>
<div id="hint" class="hidden"></div>
<div id="toast" class="sticker hidden"></div>

<!-- главное меню -->
<div id="menuScr" class="screen">
  <div class="panel">
    <div class="logo">SPEED<span>LINE</span></div>
    <button class="cbtn" id="playBtn">ГОНКА ▶</button>
    <div class="row">
      <div class="best sticker">РЕКОРД <b id="bestMenu">—</b></div>
      <button class="cbtn alt icon" id="bSettings" aria-label="Настройки">⚙</button>
      <button class="cbtn alt icon" id="bSound" aria-label="Звук">♪</button>
    </div>
    <div class="keys">W A S D — ехать · ПРОБЕЛ — дрифт · ESC — пауза</div>
  </div>
</div>

<!-- настройки -->
<div id="setScr" class="screen hidden">
  <div class="panel">
    <div class="card sticker">
      <h2>НАСТРОЙКИ</h2>
      <div class="setRow"><span>Графика</span><div class="seg" data-set="style">
        <button data-v="comic">Комикс</button><button data-v="pixel">Пиксели</button></div></div>
      <div class="setRow touchOnly"><span>Руль</span><div class="seg" data-set="steer">
        <button data-v="tilt">Наклон</button><button data-v="btn">Кнопки</button></div></div>
      <div class="setRow touchOnly tiltOnly"><span>Чувствительность</span><div class="seg" data-set="sens">
        <button data-v="0">−</button><button data-v="1">•</button><button data-v="2">+</button></div></div>
      <div class="setRow touchOnly tiltOnly"><span>Наоборот</span><div class="seg" data-set="inv">
        <button data-v="0">Нет</button><button data-v="1">Да</button></div></div>
      <div id="tiltTest" class="touchOnly tiltOnly">
        <button class="cbtn pink" id="testTiltBtn" style="padding:7px 14px;font-size:15px">Проверить</button>
        <div id="menuSteer"><div id="menuDot"></div></div>
      </div>
      <div id="sensorMsg" class="touchOnly tiltOnly"></div>
    </div>
    <button class="cbtn" id="setDone">ГОТОВО</button>
  </div>
</div>

<!-- пауза -->
<div id="pauseScr" class="screen hidden">
  <div class="panel">
    <div class="resTitle">ПАУЗА</div>
    <button class="cbtn" id="pResume">ПРОДОЛЖИТЬ</button>
    <button class="cbtn alt" id="pRestart">⟲ ЗАНОВО</button>
    <button class="cbtn alt" id="pCheckpoint">К ЧЕКПОИНТУ</button>
    <button class="cbtn alt touchOnly tiltOnly" id="pCenter">ВЫРОВНЯТЬ РУЛЬ</button>
    <button class="cbtn alt" id="pMenu">В МЕНЮ</button>
  </div>
</div>

<!-- финиш -->
<div id="resScr" class="screen hidden">
  <div class="panel">
    <div class="resTitle" id="resTitle">ФИНИШ!</div>
    <div class="card sticker">
      <div id="resTime">0:00.000</div>
      <div class="resRows">
        <div><span>До рекорда</span><b id="resDelta"></b></div>
        <div><span>Реакция на старте</span><b id="resReact"></b></div>
        <div><span>Чистый заезд</span><b id="resDrive"></b></div>
      </div>
    </div>
    <div class="row">
      <button class="cbtn" id="againBtn">⟲ ЕЩЁ РАЗ</button>
      <button class="cbtn alt" id="resMenu">МЕНЮ</button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{ 'use strict';
if(typeof THREE==='undefined'){
  document.getElementById('bestMenu').textContent='нет сети';return;}

/* ================= УТИЛИТЫ ================= */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const $=id=>document.getElementById(id);
const shortAngle=a=>{a=(a+Math.PI)%(Math.PI*2);if(a<0)a+=Math.PI*2;return a-Math.PI;};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function addSkid(w,x,z,rx,rz){const hw=0.17,y=0.046;
  const cur={lx:x-rx*hw,lz:z-rz*hw,rx:x+rx*hw,rz:z+rz*hw,x,z},L=skidLast[w];
  if(!L){skidLast[w]=cur;return;}
  const d2=(L.x-x)**2+(L.z-z)**2;if(d2<0.12)return;if(d2>9){skidLast[w]=cur;return;}
  skidPos.set([L.lx,y,L.lz,L.rx,y,L.rz,cur.lx,y,cur.lz,cur.rx,y,cur.rz],skidHead*12);
  skidHead=(skidHead+1)%SKID_MAX;skidCount=Math.min(skidCount+1,SKID_MAX);
  skidAttr.needsUpdate=true;skidGeo.setDrawRange(0,skidCount*6);skidLast[w]=cur;}

function computeCPTimes(rec){const times=[];let from=Math.min(90,rec.length-1);
  for(const ci of [...cps,0]){const c=centers[ci];let ft=null;
    for(let i=from;i<rec.length;i++){const dx=rec[i][1]-c.x,dz=rec[i][2]-c.z;
      if(dx*dx+dz*dz<9){ft=rec[i][0];from=i;break;}}
    times.push(ft);}
  return times;}
function storedNumber(key){const raw=localStorage.getItem(key);if(raw==null)return null;
  const v=Number(raw);return Number.isFinite(v)&&v>0?v:null;}
function validRecording(v){return Array.isArray(v)&&v.length>=2&&v.every((p,i)=>
  Array.isArray(p)&&p.length>=4&&p.every(Number.isFinite)&&(i===0||p[0]>=v[i-1][0]));}
function storedRecording(key){const raw=localStorage.getItem(key);if(!raw)return null;
  try{const v=JSON.parse(raw);return validRecording(v)?v:null;}catch(e){return null;}}

function initAudio(){if(AC){if(AC.state==='suspended'&&!document.hidden)AC.resume().catch(()=>{});return;}try{
  AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain();master.gain.value=settings.sound?0.6:0;master.connect(AC.destination);
  const o1=AC.createOscillator();o1.type='sawtooth';const o2=AC.createOscillator();o2.type='square';
  const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=700;f.Q.value=2;
  const g=AC.createGain();g.gain.value=0;
  o1.connect(f);o2.connect(f);f.connect(g);g.connect(master);o1.start();o2.start();
  const buf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
  const d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const src=AC.createBufferSource();src.buffer=buf;src.loop=true;
  const bf=AC.createBiquadFilter();bf.type='bandpass';bf.frequency.value=900;
  const sg=AC.createGain();sg.gain.value=0;
  src.connect(bf);bf.connect(sg);sg.connect(master);src.start();
  eng={o1,o2,f,g,sg};}catch(e){}}
function setSound(on){settings.sound=on?1:0;saveSettings();if(master)master.gain.value=on?0.6:0;
  $('bSound').textContent=on?'♪':'×';$('bSound').style.opacity=on?1:.6;}
function beep(fr,dur=0.12,type='square',vol=0.22){if(!AC||!settings.sound)return;
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=fr;
  g.gain.setValueAtTime(vol,AC.currentTime);g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+dur);
  o.connect(g);g.connect(master);o.start();o.stop(AC.currentTime+dur);}
function fanfare(recNew){[523,659,784,1046].forEach((f,i)=>setTimeout(()=>beep(f,.18,'square',.2),i*95));
  if(recNew)setTimeout(()=>beep(1318,.3,'square',.2),420);}
function buzz(ms){try{if(navigator.vibrate)navigator.vibrate(ms);}catch(e){}}

function fx(text,color,x=50,y=40,burst=false){const el=document.createElement('div');
  el.className='fx'+(burst?' burst':'');el.textContent=text;el.style.color=color;el.style.left=x+'%';el.style.top=y+'%';
  $('fxLayer').appendChild(el);setTimeout(()=>el.remove(),950);}

/* ================= ЧАСТИЦЫ ================= */
const puffTex=canvasTex(64,64,(g)=>{g.fillStyle='#c9b8ff';g.beginPath();g.arc(34,36,26,0,7);g.fill();
  g.fillStyle='#ffffff';g.beginPath();g.arc(30,30,24,0,7);g.fill();});
const sparkTex=canvasTex(64,64,(g)=>{g.fillStyle='#fff';g.beginPath();
  for(let i=0;i<8;i++){const a=i/8*Math.PI*2,r=i%2?12:31;g.lineTo(32+Math.cos(a)*r,32+Math.sin(a)*r);}g.fill();});
const parts=[];
for(let i=0;i<90;i++){const m=new THREE.SpriteMaterial({map:puffTex,transparent:true,opacity:0,depthWrite:false});
  const s=new THREE.Sprite(m);s.visible=false;scene.add(s);parts.push({s,vel:new THREE.Vector3(),life:0,max:1,grav:0,grow:0,step:0});}
function spawnP(x,y,z,col,vx,vy,vz,life,size,grav,grow,spark){
  const p=parts.find(p=>p.life<=0);if(!p)return;
  p.s.visible=true;p.s.material.map=spark?sparkTex:puffTex;p.s.material.color.set(col);p.s.material.opacity=1;
  p.s.position.set(x,y,z);p.s.scale.set(size,size,1);p.vel.set(vx,vy,vz);p.life=p.max=life;p.grav=grav;p.grow=grow;p.step=0;}
function updateParts(dt){for(const p of parts){if(p.life<=0)continue;
  p.life-=dt;if(p.life<=0){p.s.visible=false;continue;}
  p.vel.y-=p.grav*dt;p.s.position.addScaledVector(p.vel,dt);
  /* «на двойках»: размер и прозрачность меняются ступеньками, 12 раз в секунду */
  p.step+=dt;if(p.step>=1/12){p.step=0;const sc=p.s.scale.x+p.grow/12;p.s.scale.set(sc,sc,1);
    p.s.material.opacity=Math.ceil(p.life/p.max*3)/3;}}}
function clearParts(){parts.forEach(p=>{p.life=0;p.s.visible=false;});}

/* ================= МИНИ-КАРТА ================= */
const mapC=$('map'),mg=mapC.getContext('2d');
let minX=1e9,maxX=-1e9,minZ=1e9,maxZ=-1e9;
centers.forEach(p=>{minX=Math.min(minX,p.x);maxX=Math.max(maxX,p.x);minZ=Math.min(minZ,p.z);maxZ=Math.max(maxZ,p.z);});
const pad=14,mScale=Math.min((150-2*pad)/(maxX-minX),(150-2*pad)/(maxZ-minZ));
const mx=x=>pad+(x-minX)*mScale,mz=z=>pad+(z-minZ)*mScale;
const mapBase=document.createElement('canvas');mapBase.width=mapBase.height=150;
(()=>{const g=mapBase.getContext('2d');g.lineJoin='round';g.beginPath();
  centers.forEach((p,i)=>i?g.lineTo(mx(p.x),mz(p.z)):g.moveTo(mx(p.x),mz(p.z)));g.closePath();
  g.strokeStyle='#fff6e4';g.lineWidth=10;g.stroke();g.strokeStyle='#4a4560';g.lineWidth=5;g.stroke();
  g.fillStyle='#ff3d7f';g.fillRect(mx(centers[0].x)-4,mz(centers[0].z)-4,8,8);})();
function drawMap(t){mg.clearRect(0,0,150,150);mg.drawImage(mapBase,0,0);
  cps.forEach((ci,k)=>{const x=mx(centers[ci].x),z=mz(centers[ci].z);
    mg.fillStyle=k<nextCP?'#3ddc84':k===nextCP&&state==='race'?'#ffd23f':'#8f86b0';
    mg.beginPath();mg.arc(x,z,k===nextCP&&state==='race'?3.5+Math.sin(t*6)*1.2:2.4,0,7);mg.fill();});
  if(ghostBest.visible){mg.fillStyle='#35d6ff';mg.beginPath();mg.arc(mx(ghostBest.position.x),mz(ghostBest.position.z),3,0,7);mg.fill();}
  const x=mx(car.pos.x),z=mz(car.pos.z),a=Math.atan2(Math.cos(car.heading),Math.sin(car.heading));
  mg.save();mg.translate(x,z);mg.rotate(-a+Math.PI/2);mg.fillStyle='#ff3d5a';mg.strokeStyle='#1d1236';mg.lineWidth=2;
  mg.beginPath();mg.moveTo(0,-6);mg.lineTo(4.5,5);mg.lineTo(-4.5,5);mg.closePath();mg.fill();mg.stroke();mg.restore();}

function respawn(){if(state!=='race'&&state!=='pause')return;
  if(!checkpointSnapshot){startRun();return;}
  const s=checkpointSnapshot;hideScreens();clearDrivingInput();clearParts();skidLast[0]=skidLast[1]=null;
  car.pos.copy(s.pos);car.heading=s.heading;car.vel.copy(s.vel);car.idx=s.idx;
  lapTime=s.lapTime;reaction=s.reaction;nextCP=s.nextCP;
  rec=s.recording.map(p=>p.slice());recAcc=s.recAcc;contH=s.contH;prevHeading=s.prevHeading;
  shake=0;wallContact=false;slip=0;speed=car.vel.length();wrongT=0;steerVis=0;smoothAcc=0;driftT=0;
  physicsAcc=0;raceJustStarted=true;state='race';
  prevVf=car.vel.dot(new THREE.Vector3(Math.sin(car.heading),0,Math.cos(car.heading)));
  gates.forEach((g,i)=>g.barMat.color.set(i<nextCP?0x3ddc84:0xffd23f));
  setText('cpChip',nextCP+'/'+NCP);camBehind();}

function finishRun(){
  state='result';clearDrivingInput();
  runs++;try{localStorage.setItem('speedline_runs',String(runs));}catch(e){}
  const total=+lapTime.toFixed(3),drive=+driveElapsed().toFixed(3),react=+Math.max(0,total-drive).toFixed(3);
  rec.push([drive,+car.pos.x.toFixed(2),+car.pos.z.toFixed(2),+contH.toFixed(3)]);
  const prevTotal=bestTotal;
  const totalNew=prevTotal==null||total<prevTotal,driveNew=bestDrive==null||drive<bestDrive;
  if(driveNew){bestDrive=drive;ghostBestRec=rec;bestCPT=computeCPTimes(rec);ghostBest.visible=true;
    try{localStorage.setItem('speedline_best_drive',String(drive));
      localStorage.setItem('speedline_best_drive_ghost',JSON.stringify(rec));}catch(e){}}
  if(totalNew){bestTotal=total;try{localStorage.setItem('speedline_best_total',String(total));}catch(e){}}
  showBest();
  if(totalNew){celebrateT=4;buzz([30,40,30,40,80]);fx('РЕКОРД!','#ffd23f',50,30,true);
    for(let i=0;i<40;i++){const col=[0xff3d7f,0xffd23f,0x35d6ff,0x3ddc84][i%4];
      spawnP(car.pos.x+(rnd()*2-1)*4,6+rnd()*3,car.pos.z+(rnd()*2-1)*4,col,(rnd()*2-1)*4,rnd()*2,(rnd()*2-1)*4,2.2,0.6,4,0,true);}}
  $('resTitle').textContent=totalNew?'РЕКОРД!':'ФИНИШ!';$('resTitle').classList.toggle('rec',totalNew);
  $('resTime').textContent=fmt(total);
  const dEl=$('resDelta');
  if(prevTotal==null){dEl.textContent='первый заезд';dEl.className='';}
  else{const d=total-prevTotal;dEl.textContent=(d<0?'−':'+')+Math.abs(d).toFixed(3);dEl.className=d<0?'good':'bad';}
  $('resReact').textContent=react.toFixed(3)+' с';$('resDrive').textContent=fmt(drive);
  later(()=>show('resScr',true),totalNew?900:400);fanfare(totalNew);}

/* ================= ФИЗИКА ================= */
function findNearest(hint,range){let bi=0,bd2=1e18;
  if(range==null){for(let i=0;i<N;i++){const c=centers[i],d=(c.x-car.pos.x)**2+(c.z-car.pos.z)**2;if(d<bd2){bd2=d;bi=i;}}}
  else{for(let o=-range;o<=range;o++){const i=(hint+o+N)%N,c=centers[i],d=(c.x-car.pos.x)**2+(c.z-car.pos.z)**2;if(d<bd2){bd2=d;bi=i;}}}
  return bi;}
const nearIdx=(a,b,w)=>{const d=Math.abs(a-b);return Math.min(d,N-d)<=w;};
function computeSteer(){const kb=input.right-input.left;if(kb!==0)return kb;
  if(IS_TOUCH&&settings.steer==='tilt'&&tiltOK)return tiltSteer();
  return input.tr-input.tl;}

function physics(dt,live){
  const up=live&&input.up,dn=live&&input.down,steer=live?curSteer:0,hb=live&&input.hb;
  if(live&&reaction==null&&(input.up||input.down))beginDrive(lapTime-dt);
  const fwd=new THREE.Vector3(Math.sin(car.heading),0,Math.cos(car.heading));
  const rgt=new THREE.Vector3(-fwd.z,0,fwd.x);
  let vf=car.vel.dot(fwd),vl=car.vel.dot(rgt);
  let longitudinalAcc=up?ENGINE_ACCEL:0;
  if(dn)longitudinalAcc+=vf>0.5?-70:-20;
  const dragDecay=Math.exp(-LINEAR_DRAG*dt);
  vf=vf*dragDecay+longitudinalAcc/LINEAR_DRAG*(1-dragDecay);
  vf=clamp(vf,-13,MAX_FORWARD_SPEED);
  vl*=Math.exp(-(hb?1.7:8.5)*dt);
  if(hb)vf*=Math.exp(-0.9*dt);
  const dir=vf>=0?1:-1;
  const rate=2.6*clamp(Math.abs(vf)/8,0,1)*(1-0.25*Math.abs(vf)/MAX_FORWARD_SPEED)*(hb?1.5:1);
  car.heading-=steer*rate*dt*dir;
  const f2=new THREE.Vector3(Math.sin(car.heading),0,Math.cos(car.heading));
  const r2=new THREE.Vector3(-f2.z,0,f2.x);
  car.vel.copy(f2).multiplyScalar(vf).addScaledVector(r2,vl);
  car.pos.addScaledVector(car.vel,dt);
  slip=Math.abs(vl);
  car.idx=findNearest(car.idx,30);
  const c=centers[car.idx],dx=car.pos.x-c.x,dz=car.pos.z-c.z;
  const d=Math.hypot(dx,dz),lim=HW-1.15;
  if(d<lim-0.3)wallContact=false;
  if(d>lim){const nx=dx/d,nz=dz/d;
    car.pos.x=c.x+nx*lim;car.pos.z=c.z+nz*lim;
    const vn=car.vel.x*nx+car.vel.z*nz;
    if(vn>0){car.vel.x-=nx*vn*1.6;car.vel.z-=nz*vn*1.6;car.vel.multiplyScalar(0.88);
      if(vn>2.5&&!wallContact){
        shake=Math.max(shake,clamp(vn/18,0.18,1));buzz(Math.round(clamp(vn*3,15,60)));
        if(vn>7){flash=Math.max(flash,clamp(vn/20,0.5,1));
          if(lapTime-lastFxT>0.8){lastFxT=lapTime;fx(vn>14?'БАБАХ!':'БАМ!','#ff3d7f',50+(rnd()*2-1)*14,48,true);}}
        for(let i=0;i<6;i++)spawnP(car.pos.x,0.6+rnd(),car.pos.z,0xffd23f,
          -nx*4+(rnd()*2-1)*4,2+rnd()*3,-nz*4+(rnd()*2-1)*4,0.45,0.45,9,0,true);}}
    wallContact=true;}
  speed=car.vel.length();
  if(slip>7&&speed>12){for(let i=0;i<2;i++){const s=i?1:-1;
    spawnP(car.pos.x-f2.x*1.2+r2.x*0.7*s,0.3,car.pos.z-f2.z*1.2+r2.z*0.7*s,
      0xffffff,car.vel.x*0.15+(rnd()*2-1),1.2+rnd(),car.vel.z*0.15+(rnd()*2-1),0.7,0.8,1,2.2,false);}}
  if(live){
    contH+=shortAngle(car.heading-prevHeading);prevHeading=car.heading;
    if(reaction!=null){recAcc+=dt;
      if(recAcc>=1/60){recAcc%=1/60;
        rec.push([+driveElapsed().toFixed(3),+car.pos.x.toFixed(2),+car.pos.z.toFixed(2),+contH.toFixed(3)]);}}
    /* дрифт-надпись */
    if(slip>8&&speed>16){driftT+=dt;if(driftT>0.9&&lapTime-lastFxT>2.5){lastFxT=lapTime;fx('ВЖУХ!','#35d6ff',50,58);}}
    else driftT=Math.max(0,driftT-dt*2);
    const t=tangents[car.idx];
    if(nextCP<NCP&&nearIdx(car.idx,cps[nextCP],7)&&car.vel.dot(t)>0){
      gates[nextCP].barMat.color.set(0x3ddc84);
      const rt=bestCPT&&bestCPT[nextCP];
      if(rt!=null){const dd=driveElapsed()-rt;
        fx((dd<=0?'−':'+')+Math.abs(dd).toFixed(2),dd<=0?'#3ddc84':'#ff4d4d',50,24);}
      nextCP++;beep(1250,0.09,'sine',0.2);buzz(15);
      setText('cpChip',nextCP+'/'+NCP);const el=$('cpChip');el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop');
      saveCheckpoint();}
    if(nextCP===NCP&&nearIdx(car.idx,0,7)&&car.vel.dot(tangents[0])>0&&lapTime>5)finishRun();
    if(car.vel.dot(tangents[car.idx])<-3)wrongT+=dt;else wrongT=0;
    show('wrongway',!(wrongT<0.8||speed<2));}}

function placeGhost(g,rec2,ptrKey,tl){
  if(!rec2||rec2.length<2){g.visible=false;return;}
  g.visible=true;let p=g.userData[ptrKey]||0;
  if(tl<=0)p=0;else if(tl>=rec2[rec2.length-1][0])p=rec2.length-2;
  else{if(p>rec2.length-2)p=0;while(p<rec2.length-2&&rec2[p+1][0]<tl)p++;while(p>0&&rec2[p][0]>tl)p--;}
  g.userData[ptrKey]=p;
  const a=rec2[p],b=rec2[Math.min(p+1,rec2.length-1)];
  const f=clamp((tl-a[0])/Math.max(1e-6,b[0]-a[0]),0,1);
  g.position.set(lerp(a[1],b[1],f),0,lerp(a[2],b[2],f));g.rotation.y=lerp(a[3],b[3],f);}

/* ================= КАМЕРА ================= */
const CAM_BACK=IS_TOUCH?4.9:5.6,CAM_UP=IS_TOUCH?2.05:2.35;
const _f=new THREE.Vector3(),_r=new THREE.Vector3(),_up=new THREE.Vector3(0,CAM_UP,0),_d=new THREE.Vector3();
function updateCamera(dt,allowMotion){
  sun.target.position.copy(car.pos);sun.position.copy(car.pos).addScaledVector(SUN_DIR,150);
  _f.set(Math.sin(car.heading),0,Math.cos(car.heading));_r.set(-_f.z,0,_f.x);
  _d.copy(car.pos).addScaledVector(_f,-CAM_BACK).add(_up).addScaledVector(_r,steerVis*-1.1);
  if(state!=='pause')camPos.lerp(_d,1-Math.exp(-6*dt));
  if(allowMotion)shake=Math.max(0,shake-dt*2);
  const sh=allowMotion?(shake*0.25+Math.pow(speed/MAX_FORWARD_SPEED,2)*0.05):0;
  camera.position.set(camPos.x+(rnd()*2-1)*sh,camPos.y+(rnd()*2-1)*sh*0.6,camPos.z+(rnd()*2-1)*sh);
  camera.lookAt(car.pos.x+_f.x*4,car.pos.y+0.95,car.pos.z+_f.z*4);
  camera.rotateZ(-steerVis*0.07*clamp(speed/MAX_FORWARD_SPEED,0,1));
  const portrait=camera.aspect<1?16:0,fovT=62+speed*0.26+portrait;
  if(state!=='pause')camera.fov=lerp(camera.fov,clamp(fovT,62+portrait,78+portrait),1-Math.exp(-5*dt));
  camera.updateProjectionMatrix();}
function menuCamera(dt,t){
  sun.target.position.set(0,0,0);sun.position.copy(SUN_DIR).multiplyScalar(150);
  camera.position.set(Math.sin(t*0.1)*260,130,Math.cos(t*0.1)*260+20);
  camera.lookAt(0,0,20);camera.fov=lerp(camera.fov,camera.aspect<1?78:60,0.05);camera.updateProjectionMatrix();}

/* ================= АДАПТИВНОЕ РАЗРЕШЕНИЕ (стиль «Комикс») ================= */
let perfAcc=0,perfFrames=0,perfGood=0,perfWarm=2.5;
function adaptResolution(rawDt){
  if(settings.style==='pixel')return;
  if(perfWarm>0){perfWarm-=rawDt;return;}
  perfAcc+=rawDt;perfFrames++;if(perfFrames<45)return;
  const avg=perfAcc/perfFrames*1000;perfAcc=0;perfFrames=0;
  if(avg>25&&comicScale>COMIC_MIN){comicScale=Math.max(COMIC_MIN,comicScale-0.2);sizeRT();perfGood=0;}
  else if(avg<18.5&&comicScale<COMIC_MAX){if(++perfGood>=2){comicScale=Math.min(COMIC_MAX,comicScale+0.25);sizeRT();perfGood=0;}}
  else perfGood=0;}

/* ================= ЦИКЛ ================= */
let prevT=performance.now(),elapsed=0;
const _fk=new THREE.Vector3();
function loop(){
  requestAnimationFrame(loop);
  const now=performance.now();let rawDt=(now-prevT)/1000;prevT=now;
  if(!document.hidden&&rawDt<0.25)adaptResolution(rawDt);
  const dt=Math.min(rawDt,0.1);
  if(state!=='pause'){elapsed+=dt;clouds.forEach(c=>{c.position.x+=3*dt;if(c.position.x>1000)c.position.x=-1000;});}

  if(state==='menu'){menuCamera(dt,elapsed);
    if(IS_TOUCH&&tiltOK&&!$('setScr').classList.contains('hidden')){
      $('menuDot').style.transform='translateX('+(tiltSteer()*66).toFixed(1)+'px)';
      if(!$('sensorMsg').classList.contains('ok'))showSensorMsg();}}
  else{
    if(state==='lights'){lightsT+=dt;
      const nOn=Math.min(5,Math.floor(lightsT/0.6+0.001));
      while(litCount<nOn){bulbs[litCount].classList.add('on');litCount++;beep(320,0.09,'square',0.25);}
      if(input.up)falseStart();else if(lightsT>=5*0.6+goDelay)go();}
    else if(state==='fstart'){fsT-=dt;if(fsT<=0){state='lights';lightsT=0;litCount=0;goDelay=0.5+Math.random()*1.3;
      bulbs.forEach(b=>b.classList.remove('on'));show('lights',true);}}

    curSteer=state==='race'||state==='lights'?computeSteer():0;
    let racingFrame=state==='race';
    if(racingFrame){
      if(raceJustStarted){raceJustStarted=false;physicsAcc=0;}
      else{physicsAcc+=dt;
        while(physicsAcc>=PHYSICS_DT&&state==='race'){lapTime+=PHYSICS_DT;physics(PHYSICS_DT,true);physicsAcc-=PHYSICS_DT;}}
      setText('time',fmt(lapTime));
      if(IS_TOUCH&&settings.steer==='tilt'&&!tiltOK){tiltWait+=dt;
        if(tiltWait>1.5){settings.steer='btn';applySettingsUI();toast(sensorStatus().msg+'. Включил руль кнопками',4500);}}}
    racingFrame=state==='race';
    if(racingFrame)steerVis=lerp(steerVis,-curSteer*0.45,1-Math.exp(-10*dt));
    updateCamera(dt,racingFrame);

    carRoot.position.copy(car.pos);carRoot.rotation.y=car.heading;
    _fk.set(Math.sin(car.heading),0,Math.cos(car.heading));
    const vfNow=car.vel.dot(_fk);
    const braking=state==='race'&&input.down&&vfNow>0.5,throttle=state==='race'&&input.up;
    if(racingFrame){
      const acc=(vfNow-prevVf)/Math.max(dt,1e-4);prevVf=vfNow;
      smoothAcc=lerp(smoothAcc,clamp(acc,-60,60),0.1);
      bodyTilt.rotation.z=steerVis*clamp(speed/MAX_FORWARD_SPEED,0,1)*0.5;
      bodyTilt.rotation.x=-smoothAcc*0.004;
      bodyTilt.position.y=Math.sin(elapsed*9)*0.008;
      wheelSpin+=vfNow*dt/0.42;wheels.forEach(w=>w.rotation.x=wheelSpin);
      frontPivots.forEach(p=>p.rotation.y=steerVis);
      const rx=-_fk.z,rz=_fk.x;
      const marking=(slip>4.5&&speed>8)||(braking&&vfNow>18)||(input.hb&&speed>6);
      for(let w=0;w<2;w++){const s=w?1:-1;
        const wx=car.pos.x+rx*0.88*s-_fk.x*1.15,wz=car.pos.z+rz*0.88*s-_fk.z*1.15;
        if(marking)addSkid(w,wx,wz,rx,rz);else skidLast[w]=null;}}
    tailMat.color.setHex(braking?0xff2a4a:0x8a1030);
    tailGlows.forEach(g=>{const s=braking?1.5:0.55;g.scale.set(s,s,1);});
    const fl=throttle&&vfNow>2&&vfNow<MAX_FORWARD_SPEED*0.92;flame.visible=fl;
    if(fl&&Math.floor(elapsed*12)!==flame.userData.f){flame.userData.f=Math.floor(elapsed*12);
      const k=0.5+Math.random()*0.5;flame.scale.set(0.32*k,0.7*k,1);}

    gates.forEach((g,i)=>{const isNext=i===nextCP&&state==='race';
      g.laserMat.opacity=isNext?0.1+0.08*Math.sin(elapsed*5):0;
      g.bar.scale.setScalar(isNext?1+0.06*Math.sin(elapsed*5):1);});
    if(ghostBestRec)placeGhost(ghostBest,ghostBestRec,'p',driveElapsed());
    if(celebrateT>0){celebrateT-=dt;placeCrowd(elapsed,celebrateT>0);}

    setText('speed',String(Math.round(speed*SPEED_TO_KMH)));
    const sp=clamp(speed/MAX_FORWARD_SPEED,0,1);
    $('bar').style.width=(sp*100).toFixed(1)+'%';
    const sl=racingFrame?clamp((sp-0.6)/0.4,0,1)*0.6:0,slEl=$('speedlines');
    slEl.style.opacity=sl.toFixed(3);
    if(sl>0&&Math.floor(elapsed*12)!==slEl._f){slEl._f=Math.floor(elapsed*12);
      slEl.style.transform='rotate('+((Math.random()*2-1)*4).toFixed(1)+'deg)';}
    if(IS_TOUCH)$('steerDot').style.transform='translateX('+(curSteer*62).toFixed(1)+'px)';
    drawMap(elapsed);}

  if(AC&&eng){const thr=(state==='race'&&input.up)?1:0;
    const ft=55+speed*3.1+thr*22;
    eng.o1.frequency.value=lerp(eng.o1.frequency.value,ft,0.2);eng.o2.frequency.value=lerp(eng.o2.frequency.value,ft*0.5,0.2);
    eng.f.frequency.value=500+speed*18;
    const vol=(state==='race'||state==='lights')?0.05+thr*0.06+speed*0.0012:0;
    eng.g.gain.value=lerp(eng.g.gain.value,vol,0.15);
    const sk=(state==='race'&&slip>6&&speed>10)?clamp(slip*0.02,0,0.3):0;
    eng.sg.gain.value=lerp(eng.sg.gain.value,sk,0.2);}

  if(state!=='pause')updateParts(dt);
  /* удар-кадр: держится 2 кадра «на двойках», потом гаснет */
  post.uniforms.flash.value=flash>0.6?0.85:0;flash=Math.max(0,flash-dt*6);
  post.uniforms.speed.value=state==='race'?clamp((speed/MAX_FORWARD_SPEED-0.55)/0.45,0,1):0;
  renderer.setRenderTarget(rt);renderer.render(scene,camera);
  renderer.setRenderTarget(null);renderer.render(postScene,postCam);}

carRoot.position.copy(centers[START_I]);carRoot.rotation.y=startHeading;flame.visible=false;
applyStyle();
loop();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);sizeRT();});
window.__speedline={get state(){return state},get info(){return renderer.info.render},
  dbg(){return{tiltRaw,tiltCenter,motionEvents,orientEvents,steer:tiltSteer(),rt:[rt.width,rt.height]}},startRun,toMenu,input};
})();
</script>
